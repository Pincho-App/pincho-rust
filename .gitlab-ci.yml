# GitLab CI configuration for Pincho Rust SDK
#
# Triggers:
# - Push to any branch: Run lint, test, and build
# - Git tag (v*): Run full pipeline and publish to crates.io
#
# Required CI/CD Variables (set at group level):
# - CRATES_IO_TOKEN: crates.io authentication token for publishing
# - PINCHO_TOKEN: Pincho API token for release notifications

stages:
  - lint
  - test
  - build
  - publish
  - notify

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo

# Cache Cargo dependencies
.cargo-cache: &cargo-cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cargo/
      - target/

# Check code formatting
lint:fmt:
  stage: lint
  image: rust:latest
  <<: *cargo-cache
  script:
    - rustup component add rustfmt
    - cargo fmt -- --check

# Run clippy linter
lint:clippy:
  stage: lint
  image: rust:latest
  <<: *cargo-cache
  script:
    - rustup component add clippy
    - cargo clippy --all-targets -- -D warnings

# Run tests
test:
  stage: test
  image: rust:latest
  <<: *cargo-cache
  script:
    - cargo test --locked
  artifacts:
    when: always
    reports:
      junit: target/test-results.xml

# Build in release mode
build:
  stage: build
  image: rust:latest
  <<: *cargo-cache
  script:
    - cargo build --release --locked
    - cargo doc --no-deps --locked
    - cargo package --locked --allow-dirty
    - |
      echo "Verifying package contents..."
      ls -lh target/package/*.crate
      echo "✅ Package verification successful!"
  artifacts:
    paths:
      - target/package/*.crate
      - target/doc/
    expire_in: 1 week

# Publish to crates.io (only on tags)
publish:crates:
  stage: publish
  image: rust:latest
  dependencies:
    - build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - cargo publish --token "${CRATES_IO_TOKEN}" --locked --allow-dirty
    - echo "✅ Published pincho@${CI_COMMIT_TAG} to crates.io"

# Send release notification (only on tags)
notify:
  stage: notify
  image: curlimages/curl:latest
  dependencies: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - |
      curl -s -X POST https://dev-api.pincho.app/notifai \
        -H "Authorization: Bearer ${PINCHO_TOKEN}" \
        -H "Content-Type: application/json" \
        -d "{
          \"text\": \"Pincho Rust SDK ${CI_COMMIT_TAG} published to crates.io successfully. Add pincho to Cargo.toml. View package at https://crates.io/crates/pincho\",
          \"type\": \"release\"
        }"
      echo "✓ Release notification sent via NotifAI"
