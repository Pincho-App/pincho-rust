[package]
name = "wirepusher"
version = "1.0.0"
edition = "2021"
authors = ["WirePusher <support@wirepusher.dev>"]
description = "Official Rust SDK for WirePusher - Send push notifications with async/await support"
license = "MIT"
repository = "https://gitlab.com/wirepusher/rust-sdk"
homepage = "https://wirepusher.dev"
documentation = "https://docs.rs/wirepusher"
readme = "README.md"
keywords = ["push", "notifications", "wirepusher", "async", "api"]
categories = ["api-bindings", "asynchronous", "web-programming"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
futures = "0.3"

[[example]]
name = "simple"
path = "examples/simple.rs"

[[example]]
name = "advanced"
path = "examples/advanced.rs"
