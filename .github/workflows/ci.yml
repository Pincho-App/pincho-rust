# GitHub Actions CI/CD for Pincho Rust SDK
#
# Triggers:
# - Push to main: Run lint, test, and build
# - Pull request to main: Run lint, test, and build
# - Git tag (v*): Run full pipeline and publish to crates.io
#
# Required repository secrets:
# - CRATES_IO_TOKEN: crates.io authentication token for publishing
# - PINCHO_TOKEN: Pincho API token for release notifications

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release

      - name: Build documentation
        run: cargo doc --no-deps

      - name: Package crate
        run: cargo package --allow-dirty

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: crate-package
          path: target/package/*.crate
          retention-days: 7

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        run: cargo publish --token "${{ secrets.CRATES_IO_TOKEN }}" --allow-dirty

  notify:
    name: Release notification
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Send release notification via Pincho
        run: |
          curl -s -X POST https://api.pincho.app/notifai \
            -H "Authorization: Bearer ${{ secrets.PINCHO_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"Pincho Rust SDK ${{ github.ref_name }} published to crates.io successfully. Add pincho to Cargo.toml. View package at https://crates.io/crates/pincho\",
              \"type\": \"release\"
            }"
          echo "Release notification sent via NotifAI"
